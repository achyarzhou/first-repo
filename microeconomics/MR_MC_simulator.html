<!doctype html>
<html>
<head>
  <meta charset='utf-8'>
  <title>MR = MC (improved with AC & Profit)</title>
  <style>body{font-family:Arial;margin:20px} canvas{border:1px solid #ccc}</style>
</head>
<body>
  <h2>MR = MC Simulator (Perfect Competition)</h2>
  <label>Market Price (MR): 
    <input type="range" id="price" min="2" max="20" value="10" oninput="draw()">
    <span id="pval"></span>
  </label><br>
  <label>Cost Pressure: 
    <input type="range" id="cost" min="0" max="10" value="2" oninput="draw()">
    <span id="cval"></span>
  </label><br>
  <label>Fixed Cost (F): 
    <input type="range" id="fixed" min="0" max="100" value="10" oninput="draw()">
    <span id="fval"></span>
  </label><br>
  <canvas id="cv" width="700" height="460"></canvas>
  <p id="out"></p>

<script>
// MC(q) = 2 + c + 0.5*q
function mc(q,c){ return 2 + c + 0.5*q; }
// ATC (Average Total Cost) = (F + integral of MC dq) / q
// If we take TVC(q) = (2+c)q + 0.25 q^2  (since integral of 0.5*q is 0.25 q^2)
function atc(q,c,F){ if(q<=0) return Infinity; return (F + (2 + c)*q + 0.25*q*q) / q; }

function draw(){
  let P = +document.getElementById('price').value;
  let c = +document.getElementById('cost').value;
  let F = +document.getElementById('fixed').value;
  document.getElementById('pval').innerText = ' ' + P;
  document.getElementById('cval').innerText = ' ' + c;
  document.getElementById('fval').innerText = ' ' + F;

  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  ctx.clearRect(0,0,cv.width,cv.height);

  // coordinate mapping
  const left = 50, right = 650, bottom = 400, top = 40;
  const qMax = 20; // max quantity shown
  const xScale = (right - left) / qMax;
  const yScale = 14; // price units -> pixels

  // draw axes
  ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(left, bottom); ctx.lineTo(right, bottom); // x-axis
  ctx.moveTo(left, bottom); ctx.lineTo(left, top); // y-axis
  ctx.stroke();

  // axis labels
  ctx.fillStyle = '#000'; ctx.font = '12px Arial';
  ctx.fillText('Quantity Q →', (left+right)/2, bottom + 28);
  ctx.save();
  ctx.translate(left - 36, (top + bottom)/2);
  ctx.rotate(-Math.PI/2);
  ctx.fillText('Price / Cost', 0, 0);
  ctx.restore();

  // ticks on x-axis
  ctx.fillStyle = '#333'; ctx.font = '10px Arial';
  for(let i=0;i<=qMax;i+=2){
    let x = left + i * xScale;
    ctx.beginPath(); ctx.moveTo(x, bottom); ctx.lineTo(x, bottom + 6); ctx.stroke();
    ctx.fillText(i.toString(), x - 6, bottom + 20);
  }
  // ticks on y-axis (price)
  for(let p=0;p<=30;p+=5){
    let y = bottom - p * yScale;
    if(y < top || y > bottom) continue;
    ctx.beginPath(); ctx.moveTo(left - 6, y); ctx.lineTo(left, y); ctx.stroke();
    ctx.fillText(p.toString(), left - 36, y + 4);
  }

  // Draw MC curve (red)
  ctx.strokeStyle = 'red'; ctx.lineWidth = 2;
  ctx.beginPath();
  for(let q=0; q<=qMax; q+=0.1){
    let val = mc(q, c);
    let x = left + q * xScale;
    let py = bottom - val * yScale;
    if(q===0) ctx.moveTo(x,py); else ctx.lineTo(x,py);
  }
  ctx.stroke();
  ctx.fillStyle = 'red'; ctx.font = '12px Arial';
  ctx.fillText('MC', left + (qMax*0.68)*xScale, bottom - mc(qMax*0.68,c)*yScale - 10);

  // Draw ATC curve (green)
  ctx.strokeStyle = 'green'; ctx.lineWidth = 2;
  ctx.beginPath();
  for(let q=0.001; q<=qMax; q+=0.1){
    let val = atc(q, c, F);
    let x = left + q * xScale;
    let py = bottom - val * yScale;
    if(q<0.002) ctx.moveTo(x,py); else ctx.lineTo(x,py);
  }
  ctx.stroke();
  ctx.fillStyle = 'green'; ctx.fillText('ATC', left + (qMax*0.45)*xScale, bottom - atc(qMax*0.45,c,F)*yScale - 8);

  // Draw MR line (blue)
  ctx.strokeStyle = 'blue'; ctx.lineWidth = 2;
  let yMR = bottom - P * yScale;
  ctx.beginPath(); ctx.moveTo(left, yMR); ctx.lineTo(right, yMR); ctx.stroke();
  ctx.fillStyle = 'blue'; ctx.fillText('MR = P = ' + P.toFixed(2), right - 120, yMR - 6);

  // compute intersection Q* (MR = MC)
  let qstar = (P - (2 + c)) / 0.5;
  if(qstar < 0) qstar = 0;

  // clamp displayed qstar to qMax for drawing
  let displayQ = Math.min(qstar, qMax);

  // Shade profit/loss area between MR and ATC from q=0..displayQ
  if(displayQ > 0.001){
    // sample points along ATC from q=0.001 to displayQ and draw polygon
    let points = [];
    points.push({x:left, y:yMR}); // start at MR on y-axis
    for(let q=0.001;q<=displayQ;q+=0.1){
      let x = left + q * xScale;
      let y = bottom - atc(q,c,F) * yScale;
      points.push({x:x,y:y});
    }
    // ensure last vertical to MR at q=displayQ
    let xQ = left + displayQ * xScale;
    points.push({x:xQ, y:yMR});

    // draw area
    // determine if profit (MR above ATC) or loss
    // check at qstar (if qstar==0 use small q)
    let atcAtQstar = (qstar>0.001)? atc(qstar,c,F) : atc(0.001,c,F);
    let isProfit = (P > atcAtQstar);
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    for(let i=1;i<points.length;i++) ctx.lineTo(points[i].x, points[i].y);
    // close back along MR line
    ctx.closePath();
    ctx.fillStyle = isProfit ? 'rgba(0,180,0,0.2)' : 'rgba(200,0,0,0.2)';
    ctx.fill();
    ctx.strokeStyle = isProfit ? 'rgba(0,180,0,0.4)' : 'rgba(200,0,0,0.4)';
    ctx.stroke();
  }

  // draw intersection point if qstar>0
  ctx.fillStyle = 'black'; ctx.font = '12px Arial';
  if(qstar > 0.001 && qstar <= qMax){
    let xStar = left + qstar * xScale;
    let yStar = bottom - P * yScale;
    // vertical dashed line to x-axis
    ctx.strokeStyle = 'gray'; ctx.setLineDash([5,5]);
    ctx.beginPath(); ctx.moveTo(xStar, yStar); ctx.lineTo(xStar, bottom); ctx.stroke();
    ctx.setLineDash([]);
    // point
    ctx.fillStyle = 'black'; ctx.beginPath(); ctx.arc(xStar, yStar, 5, 0, Math.PI*2); ctx.fill();
    ctx.fillText('Q* = ' + qstar.toFixed(2), xStar + 8, bottom - 6);

    // show numeric profit/loss
    let atcQ = atc(qstar,c,F);
    let profit = (P - atcQ) * qstar;
    let profitText = (profit >= 0)
      ? 'Profit = (P - ATC) × Q* = (' + P.toFixed(2) + ' - ' + atcQ.toFixed(2) + ') × ' + qstar.toFixed(2) + ' = ' + profit.toFixed(2)
      : 'Loss = (P - ATC) × Q* = (' + P.toFixed(2) + ' - ' + atcQ.toFixed(2) + ') × ' + qstar.toFixed(2) + ' = ' + profit.toFixed(2);
    document.getElementById('out').innerHTML = 'Optimal Output Q* = <b>' + qstar.toFixed(2) + '</b> units<br>' + profitText;

  } else {
    // Q* = 0 or beyond qMax
    let mc0 = mc(0,c);
    if(qstar <= 0.001){
      let yMc0 = bottom - mc0 * yScale;
      ctx.fillStyle = 'darkred'; ctx.beginPath(); ctx.arc(left + 4, yMc0, 4, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'black'; ctx.fillText('MC(0) = ' + mc0.toFixed(2), left + 10, yMc0 + 4);
      document.getElementById('out').innerHTML = 'MC(0) = <b>' + mc0.toFixed(2) + '</b>. Since MC(0) &gt; P (' + P.toFixed(2) + '), optimal output is <b>Q* = 0</b> (no production).';
    } else {
      // qstar > qMax: still compute profit using qstar but indicate clipping
      let atcQ = atc(qstar,c,F);
      let profit = (P - atcQ) * qstar;
      document.getElementById('out').innerHTML = 'Q* = <b>' + qstar.toFixed(2) + '</b> (off-chart). Display clipped to Q = ' + qMax + '. Estimated profit = ' + profit.toFixed(2);
    }
  }

  // Legend box
  ctx.fillStyle = 'white'; ctx.strokeStyle = '#ccc'; ctx.lineWidth = 1;
  ctx.fillRect(right - 210, top + 10, 200, 90); ctx.strokeRect(right - 210, top + 10, 200, 90);
  // legend entries
  ctx.fillStyle = 'red'; ctx.fillRect(right - 200, top + 22, 14, 10); ctx.fillStyle = '#000'; ctx.fillText('MC (Marginal Cost)', right - 180, top + 30);
  ctx.fillStyle = 'green'; ctx.fillRect(right - 200, top + 46, 14, 10); ctx.fillStyle = '#000'; ctx.fillText('ATC (Average Total Cost)', right - 180, top + 54);
  ctx.fillStyle = 'blue'; ctx.fillRect(right - 200, top + 70, 14, 10); ctx.fillStyle = '#000'; ctx.fillText('MR (Market Price)', right - 180, top + 78);

}

// initial draw
draw();
</script>
</body>
</html>
