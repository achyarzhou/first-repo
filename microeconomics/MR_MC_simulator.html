<!doctype html>
<html>
<head>
  <meta charset='utf-8'>
  <title>MR = MC (improved)</title>
  <style>body{font-family:Arial;margin:20px} canvas{border:1px solid #ccc}</style>
</head>
<body>
  <h2>MR = MC Simulator (Perfect Competition)</h2>
  <label>Market Price (MR): 
    <input type="range" id="price" min="2" max="20" value="10" oninput="draw()">
    <span id="pval"></span>
  </label><br>
  <label>Cost Pressure: 
    <input type="range" id="cost" min="0" max="10" value="2" oninput="draw()">
    <span id="cval"></span>
  </label><br>
  <canvas id="cv" width="700" height="420"></canvas>
  <p id="out"></p>

<script>
function mc(q,c){ return 2 + c + 0.5*q; } // MC(q) = 2 + c + 0.5*q

function draw(){
  let P = +document.getElementById('price').value;
  let c = +document.getElementById('cost').value;
  document.getElementById('pval').innerText = ' ' + P;
  document.getElementById('cval').innerText = ' ' + c;

  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  ctx.clearRect(0,0,cv.width,cv.height);

  // coordinate mapping
  const left = 50, right = 650, bottom = 370, top = 40;
  const qMax = 20; // max quantity shown
  const xScale = (right - left) / qMax;
  const yScale = 15; // price units -> pixels (same as original)

  // draw axes
  ctx.strokeStyle = '#000';
  ctx.beginPath();
  ctx.moveTo(left, bottom); ctx.lineTo(right, bottom); // x-axis
  ctx.moveTo(left, bottom); ctx.lineTo(left, top); // y-axis
  ctx.stroke();

  // axis labels
  ctx.fillStyle = '#000'; ctx.font = '12px Arial';
  ctx.fillText('Quantity Q →', (left+right)/2, bottom + 25);
  ctx.save();
  ctx.translate(left - 35, (top + bottom)/2);
  ctx.rotate(-Math.PI/2);
  ctx.fillText('Price / Cost', 0, 0);
  ctx.restore();

  // ticks on x-axis
  ctx.fillStyle = '#333'; ctx.font = '10px Arial';
  for(let i=0;i<=qMax;i+=2){
    let x = left + i * xScale;
    ctx.beginPath(); ctx.moveTo(x, bottom); ctx.lineTo(x, bottom + 6); ctx.stroke();
    ctx.fillText(i.toString(), x - 6, bottom + 20);
  }
  // ticks on y-axis (price)
  for(let p=0;p<=25;p+=5){
    let y = bottom - p * yScale;
    if(y < top || y > bottom) continue;
    ctx.beginPath(); ctx.moveTo(left - 6, y); ctx.lineTo(left, y); ctx.stroke();
    ctx.fillText(p.toString(), left - 34, y + 4);
  }

  // Draw MC curve (red)
  ctx.strokeStyle = 'red';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for(let q=0; q<=qMax; q+=0.1){
    let val = mc(q, c);
    let x = left + q * xScale;
    let py = bottom - val * yScale;
    if(q===0) ctx.moveTo(x,py); else ctx.lineTo(x,py);
  }
  ctx.stroke();
  // label MC
  ctx.fillStyle = 'red'; ctx.font = '12px Arial';
  ctx.fillText('MC', left + (qMax*0.7)*xScale, bottom - mc(qMax*0.7,c)*yScale - 8);

  // Draw MR line (blue)
  ctx.strokeStyle = 'blue';
  ctx.lineWidth = 2;
  let yMR = bottom - P * yScale;
  ctx.beginPath(); ctx.moveTo(left, yMR); ctx.lineTo(right, yMR); ctx.stroke();
  // label MR
  ctx.fillStyle = 'blue';
  ctx.fillText('MR = P = ' + P.toFixed(2), right - 100, yMR - 6);

  // compute intersection Q*
  let qstar = (P - (2 + c)) / 0.5;
  // mc at q=0
  let mc0 = mc(0, c);

  // draw intersection or show no production
  ctx.fillStyle = 'black'; ctx.font = '12px Arial';
  if(qstar > 0 && qstar <= qMax){
    let xStar = left + qstar * xScale;
    let yStar = bottom - P * yScale;
    // vertical dashed line to x-axis
    ctx.strokeStyle = 'gray'; ctx.setLineDash([5,5]);
    ctx.beginPath(); ctx.moveTo(xStar, yStar); ctx.lineTo(xStar, bottom); ctx.stroke();
    ctx.setLineDash([]);
    // point
    ctx.fillStyle = 'black';
    ctx.beginPath(); ctx.arc(xStar, yStar, 5, 0, Math.PI*2); ctx.fill();
    ctx.fillText('Q* = ' + qstar.toFixed(2), xStar + 8, bottom - 6);
    document.getElementById('out').innerHTML = 'Optimal Output Q* = <b>' + qstar.toFixed(2) + '</b> units';
  } else {
    // Q* <= 0  (no production) -> show message and annotate MC(0)
    // mark MC(0) on y-axis
    let yMc0 = bottom - mc0 * yScale;
    ctx.fillStyle = 'darkred';
    ctx.beginPath(); ctx.arc(left + 4, yMc0, 4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'black';
    ctx.fillText('MC(0) = ' + mc0.toFixed(2), left + 10, yMc0 + 4);
    // explain
    document.getElementById('out').innerHTML = 
      'MC(0) = <b>' + mc0.toFixed(2) + '</b>. Since MC(0) > P (' + P.toFixed(2) + '), optimal output is <b>Q* = 0</b> (no production).';
  }

  // Legend box
  ctx.fillStyle = 'white'; ctx.strokeStyle = '#ccc'; ctx.lineWidth = 1;
  ctx.fillRect(right - 160, top + 10, 150, 60); ctx.strokeRect(right - 160, top + 10, 150, 60);
  // legend entries
  ctx.fillStyle = 'red'; ctx.fillRect(right - 150, top + 20, 12, 8); ctx.fillStyle = '#000'; ctx.fillText('MC (Marginal Cost)', right - 130, top + 27);
  ctx.fillStyle = 'blue'; ctx.fillRect(right - 150, top + 42, 12, 8); ctx.fillStyle = '#000'; ctx.fillText('MR (Market Price)', right - 130, top + 49);
}
draw();
</script>
</body>
</html>
